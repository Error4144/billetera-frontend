server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /graphql {
        proxy_pass http://bff:3000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
        client_max_body_size 100k;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /graphql/ { return 404; }
    location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
